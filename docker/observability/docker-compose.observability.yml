# Local observability stack (issue #193). Everything the app sends goes to the OTel Collector over OTLP/HTTP.
#
# Two ways to bring it up (one at a time, both publish the same host ports):
#   Standalone: docker compose -f docker/observability/docker-compose.observability.yml up -d
#   Combined:   docker compose -f docker/docker-compose.yml -f docker/observability/docker-compose.observability.yml up -d
#
# Rules this file keeps (checked by docker/observability/scripts/lint_compose.py):
#   - No top-level `name:`. In the combined mode the last file's name wins and would rename the app project.
#   - Every bind mount starts with ${OBS_DIR:-.}/. In the combined mode Compose resolves relative paths from
#     docker/, so docker/.env sets OBS_DIR=./observability; standalone, the default "." applies.
#   - Every image has an exact version tag, every published port is bound to 127.0.0.1,
#     every service rotates its logs, and every volume has a fixed name shared by both modes.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.7.9
    container_name: hairmatch_obs_loki
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ${OBS_DIR:-.}/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - app_network
    logging: *default-logging
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10
    container_name: hairmatch_obs_tempo
    command: -config.file=/etc/tempo/config.yaml
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ${OBS_DIR:-.}/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - app_network
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: hairmatch_obs_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # OTLP in, as the Collector sends it; exemplars keep the trace_id of a metric point.
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${OBS_DIR:-.}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_network
    logging: *default-logging
    restart: unless-stopped

networks:
  # Standalone this is observability_app_network; combined it is the app's hairmatch_app_network.
  app_network: {}

volumes:
  loki_data:
    name: hairmatch_obs_loki
  tempo_data:
    name: hairmatch_obs_tempo
  prometheus_data:
    name: hairmatch_obs_prometheus
