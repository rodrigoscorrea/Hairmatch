# Data sources with fixed UIDs, so dashboards and the links between signals never depend on creation order.
# In provisioning files Grafana expands $VAR; "$$" keeps a literal "$" for the placeholders it fills in later.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Exemplar -> trace
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Log -> trace. trace_id is structured metadata that Loki returns beside the stream labels.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Trace -> logs. trace_id is structured metadata in Loki, so it is filtered with a pipe, not a line filter.
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      # No metrics-generator in this stack, so the service map and node graph have no data.
      nodeGraph:
        enabled: false

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    editable: false
