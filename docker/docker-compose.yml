version: '3.8'

name: hairmatch

services:
  db:
    image: postgres:17
    container_name: hairmatch_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: hairmatch_backend
    command: /app/entrypoint.sh
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      #angular:
      #  condition: service_started
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      ministack:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - BACKEND_ALLOWED_HOST=${BACKEND_ALLOWED_HOST}
      - BACKEND_ALLOWED_CORS=${BACKEND_ALLOWED_CORS}
      - GOOGLE_OAUTH_CLIENT_IDS=${GOOGLE_OAUTH_CLIENT_IDS}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # boto3 calls go through the docker network; media URLs sent to clients use the host endpoint (.env)
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_PUBLIC_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      # Cognito is not in the LocalStack free plan, so it runs on MiniStack. boto3 reads the per-service endpoint.
      - AWS_ENDPOINT_URL_COGNITO_IDENTITY_PROVIDER=http://ministack:4566
      # Empty in dev: the backend looks up the hairmatch-dev pool and hairmatch-backend client by name.
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID:-}
    restart: always
    networks:
      - app_network
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: hairmatch_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network
    depends_on:
      - db
    restart: always

  #evolution-api:
  #  container_name: evolution_api
  #  image: atendai/evolution-api:v2.1.1
  #  restart: always
  #  ports:
  #    - "8080:8080"
  #  networks:
  #    - app_network
  #  env_file:
  #    - ./.env
  #  volumes:
  #    - evolution_instances:/evolution/instances

  localstack:
    image: localstack/localstack-pro:${LOCALSTACK_IMAGE_TAG:-latest}
    container_name: hairmatch_localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env (get it at app.localstack.cloud)}
      SERVICES: s3,ses
      PERSISTENCE: 0
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dev-hairmatch-media}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-no-reply@hairmatch.local}
    volumes:
      # Init scripts only (code, not state). No data volume: the free plan does not allow persistence.
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    networks:
      - app_network
    healthcheck:
      # Healthy only after the ready.d init scripts (bucket, CORS, policy) have finished
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ministack:
    image: ministackorg/ministack:${MINISTACK_IMAGE_TAG:-latest}
    container_name: hairmatch_ministack
    ports:
      # 4566 on the host belongs to LocalStack. The app never talks to Cognito, so this port is only for debugging.
      - "4567:4566"
    environment:
      MINISTACK_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSIST_STATE: 1
      STATE_DIR: /var/lib/ministack
    volumes:
      # Users, pool, client and signing key survive restarts; the init script only creates what is missing.
      - ministack_state:/var/lib/ministack
      - ./ministack/init:/etc/localstack/init/ready.d:ro
    networks:
      - app_network
    healthcheck:
      # Healthy only after the init script has created the pool
      test: ["CMD-SHELL", "awslocal cognito-idp list-user-pools --max-results 60 | grep -q hairmatch-dev"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  #angular:
  #  build: ./frontend/
  #  container_name: angular_frontend
  #  command: npm start -- --host 0.0.0.0
  #  volumes:
  #    - ./frontend:/app
  #  ports:
  #    - "4200:4200"
  #  networks:
  #    - app_network
  #  restart: always
networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  evolution_instances:
  ministack_state:
