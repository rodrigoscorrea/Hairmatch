name: Run Hairmatch Backend Unit Tests

on:
  push:
    branches:
      - improvement/frontend_style_adjustments
      - develop
      - main
  pull_request:
    branches:
      - improvement/frontend_style_adjustments
      - develop
      - main

# The job only checks out and runs the tests: the token needs no write access.
permissions:
  contents: read

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hairmatch_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: hairmatch_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      BACKEND_ALLOWED_HOST: localhost
      BACKEND_ALLOWED_CORS: http://localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./backend
        run: python manage.py migrate

      - name: Run tests
        working-directory: ./backend
        run: coverage run manage.py test
      
      - name: Run tests coverage report
        working-directory: ./backend
        run: coverage report -m
